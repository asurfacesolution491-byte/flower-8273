<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOWER 8273</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="rose-background">
    <img src="image_7d1d8bce.jpg" alt="">
  </div>

  <div class="puzzle-window" id="puzzleWindow">

    <div class="window-bar" id="windowBar">
      <span>FLOWER 8273</span>

      <div>
        <button id="minimizeButton">−</button>
        <button id="closeButton">×</button>
      </div>
    </div>

    <div class="window-content">
      <input
        type="text"
        id="puzzleInput"
        placeholder="..."
        autocomplete="off"
      >
    </div>

  </div>

  <script src="script.js"></script>
<div style="
  position: fixed;
  right: 0;
  bottom: 0;
  width: 1in;
  height: 1in;
  background: #000;
  z-index: 50;
"></div>
  <div id="thornPuzzle" style="
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  z-index: 200;
  padding: 30px;
  box-sizing: border-box;
  text-align: center;
">
  <h2 id="puzzleType"></h2>

  <p>UNJUMBLE THE CODE.</p>

  <div id="numberGrid" style="
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 8px;
    justify-content: center;
    margin: 30px auto;
  "></div>

  <p id="unlockMessage"></p>
  </div>
</body>
</html>
