<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOWER 8273</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Large rose -->
  <div class="logo" aria-label="Flower 8273 rose">

    <svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">

      <!-- Main black rose silhouette -->
      <path
        fill="#000"
        d="
        M390 465
        C315 450 235 420 190 360
        C145 300 150 215 215 175
        C255 150 300 155 335 180
        C355 125 425 105 475 145
        C510 115 575 135 595 185
        C665 185 700 250 665 305
        C640 350 585 385 520 420
        C485 440 455 455 430 470
        C475 525 490 600 470 675
        C455 735 430 785 405 820
        L350 820
        C325 770 295 710 290 650
        C285 575 315 510 390 465
        Z
        "
      />

      <!-- Outer petal highlights -->
      <path
        d="M190 360 C155 300 170 220 225 185 C205 245 225 310 285 345"
        fill="none"
        stroke="#fff"
        stroke-width="18"
        stroke-linecap="round"
      />

      <path
        d="M225 185 C270 145 320 165 345 205 C300 205 270 235 260 275"
        fill="none"
        stroke="#fff"
        stroke-width="16"
        stroke-linecap="round"
      />

      <path
        d="M335 180 C360 125 425 115 470 150 C420 155 385 190 380 240"
        fill="none"
        stroke="#fff"
        stroke-width="17"
        stroke-linecap="round"
      />

      <path
        d="M475 145 C520 115 575 140 590 185 C545 175 505 195 485 235"
        fill="none"
        stroke="#fff"
        stroke-width="16"
        stroke-linecap="round"
      />

      <path
        d="M595 185 C655 185 690 245 665 305 C630 275 585 275 545 300"
        fill="none"
        stroke="#fff"
        stroke-width="17"
        stroke-linecap="round"
      />

      <!-- Curled inner petals -->
      <path
        d="
        M285 345
        C300 275 365 235 430 255
        C490 275 510 330 475 375
        C445 415 385 420 350 385
        C320 355 335 315 370 300
        C405 285 445 305 450 335
        C455 360 430 380 405 370
        "
        fill="none"
        stroke="#fff"
        stroke-width="19"
        stroke-linecap="round"
      />

      <path
        d="M250 365 C300 410 355 425 405 410"
        fill="none"
        stroke="#fff"
        stroke-width="13"
        stroke-linecap="round"
      />

      <path
        d="M465 365 C520 345 565 330 610 300"
        fill="none"
        stroke="#fff"
        stroke-width="12"
        stroke-linecap="round"
      />

      <!-- Small light-catching petal edges -->
      <path
        d="M215 325 C245 350 270 360 295 365"
        fill="none"
        stroke="#fff"
        stroke-width="10"
        stroke-linecap="round"
      />

      <path
        d="M510 250 C535 230 560 225 585 235"
        fill="none"
        stroke="#fff"
        stroke-width="10"
        stroke-linecap="round"
      />

      <!-- Stem -->
      <path
        d="M405 440
           C395 525 420 610 405 700
           C395 755 380 790 365 820"
        fill="none"
        stroke="#fff"
        stroke-width="15"
        stroke-linecap="round"
      />

      <!-- Stem shadow -->
      <path
        d="M420 475
           C435 565 430 645 420 710"
        fill="none"
        stroke="#000"
        stroke-width="20"
        stroke-linecap="round"
      />

      <!-- Leaf -->
      <path
        d="
        M405 620
        C345 565 265 575 225 625
        C285 665 350 660 405 620
        Z
        "
        fill="#000"
      />

      <!-- Leaf illumination -->
      <path
        d="M235 625 C285 620 340 630 385 620"
        fill="none"
        stroke="#fff"
        stroke-width="11"
        stroke-linecap="round"
      />

    </svg>
  </div>


  <!-- Puzzle window -->
  <div class="puzzle-window" id="puzzleWindow">

    <div class="window-bar" id="windowBar">
      <span>FLOWER 8273</span>

      <div>
        <button type="button" id="minimizeButton">−</button>
        <button type="button" id="closeButton">×</button>
      </div>
    </div>

    <div class="window-content">
      <input
        type="text"
        id="puzzleInput"
        placeholder="..."
        autocomplete="off"
      >
    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
