  <style>
    /* Natural black-and-white rose */
    .rose-scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      background: #000;
    }

    .rose {
      position: absolute;
      width: min(105vw, 1100px);
      height: min(105vh, 1100px);
      left: 50%;
      top: 50%;
      transform: translate(-46%, -50%) rotate(5deg);
    }

    .rose svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .black {
      fill: #000;
      stroke: #000;
    }

    .white {
      fill: #fff;
      stroke: #fff;
    }

    .outline {
      fill: none;
      stroke: #fff;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .petal-line {
      fill: none;
      stroke: #000;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .light-edge {
      fill: none;
      stroke: #fff;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .puzzle-window {
      z-index: 100;
    }
  </style>
</head>
